name: Build OakAdvisor

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Self-test on bundled sample screen
        run: python tools/selftest.py
      - name: Build
        run: pyinstaller OakAdvisor.spec --noconfirm
      - name: Check the text-reader models were bundled
        run: if (-not (Test-Path dist/OakAdvisor/_internal/rapidocr_onnxruntime/models/ch_PP-OCRv3_det_infer.onnx)) { exit 1 }
      - name: Zip
        run: Compress-Archive -Path dist/OakAdvisor -DestinationPath OakAdvisor-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: OakAdvisor-windows
          path: OakAdvisor-windows.zip
